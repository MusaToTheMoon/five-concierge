            - listitem [ref=f1e111]:
              - paragraph [ref=f1e112]: Bohemia is a luxury beach club at FIVE Palm Jumeirah in Dubai, offering an ultra-luxe experience with sun loungers, an infinity glass pool, and curated music programming. The CONTEXT does not mention a Bohemia in Zurich. For information on nightlife at FIVE Zurich, you might consider The Penthouse at FIVE Zurich, which is a rooftop terrace, lounge, and nightclub with panoramic city views.
            - listitem [ref=f1e117]:
              - paragraph [ref=f1e118]: Tell me about the ReFIVE spa
            - listitem [ref=f1e125]:
              - paragraph [ref=f1e126]: "ReFIVE Spa is FIVE's in-house spa brand, available at FIVE Palm Jumeirah, FIVE LUXE JBR, FIVE Jumeirah Village, and FIVE Zurich. It focuses on recovery, offering treatments, rituals, and studio classes designed to help guests reset between their beach days and club nights. The flagship ReFIVE Spa at FIVE Palm Jumeirah features an award-winning hammam, Sensorial Head Spa rituals, facials using SODASHI organic skincare and Natura Bissé actives, sports recovery massage, steam room, ice-bath therapy, a rooftop spa pool with hydrotherapy jets, and Reformer Pilates classes. It also has a Brow Studio. At other properties, ReFIVE Spa is joined by additional wellness offerings: The Gym at FIVE LUXE JBR and FIVE Zurich, The Salon at FIVE LUXE and FIVE Jumeirah Village, and a Peaky Blinders Barbershop at FIVE Jumeirah Village. FIVE Zurich also has an outdoor Social Pool, and Destino FIVE Ibiza offers THE GYM."
